name: CI

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      publish_nuget:
        description: 'Publish package to NuGet.org'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore NLog.FastNetworkTarget.sln

    - name: Build solution (Release)
      run: dotnet build NLog.FastNetworkTarget.sln -c Release --no-restore

    - name: Run .NET 8 Tests
      run: dotnet test NLog.FastNetworkTarget.Tests/NLog.FastNetworkTarget.Tests.csproj -c Release -f net8.0 --no-build --logger "trx"

    - name: Run .NET Framework 4.6.2 Tests (Windows only)
      if: runner.os == 'Windows'
      run: dotnet test NLog.FastNetworkTarget.Tests/NLog.FastNetworkTarget.Tests.csproj -c Release -f net462 --no-build --logger "trx"

    - name: Upload NuGet Packages
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: NLog.FastNetworkTarget/bin/Release/*.nupkg

  publish:
    name: Publish to NuGet
    needs: build
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_nuget)
    runs-on: ubuntu-latest
    steps:
    - name: Download NuGet Packages
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
        path: packages

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Push to NuGet.org
      run: dotnet nuget push "packages/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
